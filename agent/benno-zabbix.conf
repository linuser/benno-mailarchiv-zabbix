# Benno MailArchiv: UserParameters that read the JSON written by the root cron.
# (The Zabbix agent user may not read the journal / archive repo / Benno logs,
#  so the collector script writes agent-readable JSON files instead.)
#
# Place in /etc/zabbix/zabbix_agent2.d/ (agent 2) or your agent include dir.
# The paths below MUST match BENNO_STATE_DIR in benno-zabbix-status.sh
# (default /var/lib/benno-zabbix, a root-owned dir the agent only reads).
#
# The keys take NO arguments: the collector is configured in the script itself,
# not through item macros. Site thresholds live in the template's macros.
#
# benno.status: staleness guard. 'find -mmin -15' prints the file ONLY if it was
# written in the last 15 minutes, so a stopped cron/script makes the agent return
# an EMPTY value -> the status item's HIGH trigger (length()=0 or nodata) fires
# instead of serving a frozen value.
UserParameter=benno.status,find /var/lib/benno-zabbix/benno_status.json -mmin -15 -exec cat {} \; 2>/dev/null
#
# benno.archive_total: plain cat (the file is refreshed only every ~6h). Its
# freshness is enforced template-side by a fuzzytime() trigger on the JSON's
# "ts" field (item benno.archive.ts), not here.
UserParameter=benno.archive_total,cat /var/lib/benno-zabbix/benno_archive_total.json 2>/dev/null
